[project]
name = "voxcpm-narrate"
version = "0.1.0"
description = "Portable local narration TTS batch for VoxCPM2 (uv-managed)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "voxcpm-narrate contributors" }]
keywords = ["tts", "voxcpm", "speech", "narration", "batch"]
dependencies = [
  "voxcpm>=2.0.0",
  "soundfile>=0.12.1",
  "numpy>=1.24.0",
  "torch>=2.5.0",
  "torchaudio>=2.5.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9.0",
]

[project.scripts]
voxcpm-narrate = "voxcpm_narrate.cli:main"
voxcpm-narrate-web = "voxcpm_narrate.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxcpm_narrate"]

[tool.hatch.build.targets.wheel.force-include]
"src/voxcpm_narrate/web/static" = "voxcpm_narrate/web/static"

[tool.hatch.build.targets.sdist]
include = [
  "src/voxcpm_narrate",
  "README.md",
  "LICENSE",
  "pyproject.toml",
  "examples",
  "workspace/README.md",
  "workspace/.gitkeep",
  "generate_speech.zsh",
  "improve_speech.zsh",
  "serve_web.zsh",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
